<div class="max-w-2xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">
      {{ isEditMode() ? 'Edit User' : 'New User' }}
    </h2>
  </div>

  <div
    class="bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-gray-200 dark:border-slate-700 p-6 transition-colors"
  >
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-slate-300"
          >Name</label
        >
        <input
          type="text"
          id="name"
          formControlName="name"
          class="block w-full rounded-md border border-gray-300 px-3 py-2.5 text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 transition-colors"
        />
        @if (name?.invalid && name?.touched) {
        <p class="mt-1 text-sm text-red-600 dark:text-red-400">Name is required</p>
        }
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300"
          >Email</label
        >
        <input
          type="email"
          id="email"
          formControlName="email"
          class="block w-full rounded-md border border-gray-300 px-3 py-2.5 text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:placeholder-slate-400 transition-colors"
        />
        @if (email?.invalid && email?.touched) {
        <p class="mt-1 text-sm text-red-600 dark:text-red-400">Valid email is required</p>
        }
      </div>

      <div>
        <label for="role" class="block text-sm font-medium text-gray-700 dark:text-slate-300"
          >Role</label
        >
        <div class="relative">
          <select
            id="role"
            formControlName="role"
            class="block w-full appearance-none rounded-md border border-gray-300 py-2.5 pl-3 pr-10 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white transition-colors"
          >
            <option value="user">User</option>
            <option value="admin">Admin</option>
            <option value="editor">Editor</option>
          </select>
          <div
            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500 dark:text-slate-400"
          >
            <lucide-angular [img]="ChevronDown" class="h-4 w-4"></lucide-angular>
          </div>
        </div>
      </div>

      <div class="relative flex items-start">
        <div class="flex h-6 items-center">
          <input
            id="active"
            formControlName="active"
            type="checkbox"
            class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:bg-slate-700 dark:border-slate-600 dark:ring-offset-slate-800"
          />
        </div>
        <div class="ml-3 text-sm leading-6">
          <label for="active" class="font-medium text-gray-900 dark:text-slate-300">Active</label>
          <p class="text-gray-500 dark:text-slate-400">Enable or disable this user account.</p>
        </div>
      </div>

      <div class="flex justify-end pt-4 gap-3">
        <a
          routerLink="/users"
          class="rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 dark:bg-slate-800 dark:text-slate-200 dark:ring-slate-700 dark:hover:bg-slate-700"
        >
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="userForm.invalid || isSaving()"
          class="inline-flex justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50"
        >
          {{ isSaving() ? 'Saving...' : 'Save User' }}
        </button>
      </div>
    </form>
  </div>
</div>
