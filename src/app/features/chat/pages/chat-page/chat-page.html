<div class="chat-container flex h-full">
  <!-- Sidebar -->
  <div
    class="w-80 border-r border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-col"
  >
    <div class="p-4 border-b border-gray-200 dark:border-slate-700">
      <h2 class="text-lg font-bold text-gray-900 dark:text-white">Messages</h2>
      <div class="mt-2 relative">
        <input
          type="text"
          placeholder="Search..."
          class="w-full pl-8 pr-4 py-2 bg-gray-100 dark:bg-slate-700 rounded-lg text-sm text-gray-900 dark:text-white dark:placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    </div>

    <div class="flex-1 overflow-y-auto">
      @for (user of users(); track user.id) {
        <button
          class="w-full p-4 flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-slate-700/50 transition-colors border-l-4 border-transparent"
          [class.bg-blue-50]="currentUser()?.id === user.id"
          [class.dark:bg-blue-900/20]="currentUser()?.id === user.id"
          [class.border-blue-600]="currentUser()?.id === user.id"
          (click)="selectUser(user.id)"
        >
          <div class="relative">
            <img
              [src]="user.avatar"
              [alt]="user.name"
              class="w-10 h-10 rounded-full bg-gray-200 dark:bg-slate-600"
            />
            <div
              class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white dark:border-slate-800"
              [class.bg-green-500]="user.status === 'online'"
              [class.bg-red-500]="user.status === 'busy'"
              [class.bg-gray-400]="user.status === 'offline'"
            ></div>
          </div>
          <div class="flex-1 text-left">
            <div class="flex justify-between items-center">
              <span class="font-medium text-gray-900 dark:text-white">{{ user.name }}</span>
              @if (user.unreadCount > 0) {
                <span class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">{{
                  user.unreadCount
                }}</span>
              }
            </div>
            <p class="text-sm text-gray-500 dark:text-slate-400 truncate">{{ user.lastMessage }}</p>
          </div>
        </button>
      }
    </div>
  </div>

  <!-- Chat Area -->
  <div class="flex-1 flex flex-col bg-gray-50 dark:bg-slate-900">
    @if (currentUser(); as user) {
      <!-- Header -->
      <div
        class="h-16 border-b border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-between px-6"
      >
        <div class="flex items-center gap-3">
          <img
            [src]="user.avatar"
            [alt]="user.name"
            class="w-10 h-10 rounded-full bg-gray-200 dark:bg-slate-600"
          />
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white">{{ user.name }}</h3>
            <span class="text-xs text-green-500 flex items-center gap-1">
              <div class="w-2 h-2 bg-green-500 rounded-full"></div>
              Online
            </span>
          </div>
        </div>
        <div class="flex items-center gap-4 text-gray-400 dark:text-slate-400">
          <button class="hover:text-blue-600 dark:hover:text-blue-400">
            <lucide-angular [img]="Phone" [size]="20"></lucide-angular>
          </button>
          <button class="hover:text-blue-600 dark:hover:text-blue-400">
            <lucide-angular [img]="Video" [size]="20"></lucide-angular>
          </button>
          <button class="hover:text-blue-600 dark:hover:text-blue-400">
            <lucide-angular [img]="Info" [size]="20"></lucide-angular>
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div class="flex-1 overflow-y-auto p-6 space-y-4 messages-area">
        @for (msg of messages(); track msg.id) {
          <div class="flex" [class.justify-end]="msg.isMe">
            <div
              class="max-w-[70%] rounded-2xl px-4 py-2 shadow-sm"
              [class.bg-blue-600]="msg.isMe"
              [class.text-white]="msg.isMe"
              [class.rounded-tr-none]="msg.isMe"
              [class.bg-white]="!msg.isMe"
              [class.dark:bg-slate-800]="!msg.isMe"
              [class.text-gray-900]="!msg.isMe"
              [class.dark:text-white]="!msg.isMe"
              [class.rounded-tl-none]="!msg.isMe"
            >
              <p>{{ msg.text }}</p>
              <p
                class="text-xs mt-1 opacity-70"
                [class.text-blue-100]="msg.isMe"
                [class.text-gray-400]="!msg.isMe"
                [class.dark:text-slate-400]="!msg.isMe"
              >
                {{ msg.timestamp | date: 'shortTime' }}
              </p>
            </div>
          </div>
        }
      </div>

      <!-- Input -->
      <div class="p-4 bg-white dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700">
        <div class="flex items-center gap-4 max-w-4xl mx-auto">
          <button class="text-gray-400 hover:text-blue-600 dark:hover:text-blue-400">
            <lucide-angular [img]="Paperclip" [size]="20"></lucide-angular>
          </button>
          <input
            #messageInput
            type="text"
            placeholder="Type a message..."
            class="flex-1 bg-gray-100 dark:bg-slate-700 rounded-full px-4 py-2 text-gray-900 dark:text-white dark:placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            (keyup.enter)="sendMessage(messageInput)"
          />
          <button
            class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center hover:bg-blue-700 transition-colors"
            (click)="sendMessage(messageInput)"
          >
            <lucide-angular [img]="Send" [size]="18"></lucide-angular>
          </button>
        </div>
      </div>
    } @else {
      <div
        class="flex-1 flex flex-col items-center justify-center text-gray-400 dark:text-slate-500"
      >
        <div
          class="w-20 h-20 bg-gray-200 dark:bg-slate-700 rounded-full flex items-center justify-center mb-4 text-gray-500 dark:text-slate-400"
        >
          <lucide-angular [img]="MessageSquare" [size]="40"></lucide-angular>
        </div>
        <p class="text-lg font-medium">Select a conversation to start chatting</p>
      </div>
    }
  </div>
</div>
